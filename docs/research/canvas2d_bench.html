<!doctype html>
<meta charset="utf-8">
<title>Canvas 2D wireframe spike</title>
<canvas id="c" width="1280" height="720"></canvas>
<pre id="out">running</pre>
<script>
// Spike: can Canvas 2D with our own perspective projection draw a wireframe scene fast enough?
// Each frame: rotate a camera, project N 3D line segments, clip against the near plane,
// stroke them in one batched path, then force a flush with a 1x1 getImageData.
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, F = W / 2 / Math.tan(Math.PI / 6), NEAR = 0.5;

function makeSegments(n) {
  const a = new Float32Array(n * 6);
  let s = 12345;
  const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < n; i++) {
    const x = (rnd() - 0.5) * 400, z = (rnd() - 0.5) * 400, y = rnd() * 6;
    a[i * 6] = x; a[i * 6 + 1] = y; a[i * 6 + 2] = z;
    a[i * 6 + 3] = x + (rnd() - 0.5) * 10; a[i * 6 + 4] = y + (rnd() - 0.5) * 6; a[i * 6 + 5] = z + (rnd() - 0.5) * 10;
  }
  return a;
}

function frame(seg, n, yaw, glow) {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#3f6'; ctx.lineWidth = 2;
  ctx.shadowBlur = glow ? 8 : 0; ctx.shadowColor = '#3f6';
  ctx.beginPath();
  let drawn = 0;
  for (let i = 0; i < n; i++) {
    const o = i * 6;
    let x1 = seg[o] * c - seg[o + 2] * s, z1 = seg[o] * s + seg[o + 2] * c, y1 = seg[o + 1] - 2;
    let x2 = seg[o + 3] * c - seg[o + 5] * s, z2 = seg[o + 3] * s + seg[o + 5] * c, y2 = seg[o + 4] - 2;
    if (z1 < NEAR && z2 < NEAR) continue;
    if (z1 < NEAR) { const t = (NEAR - z1) / (z2 - z1); x1 += (x2 - x1) * t; y1 += (y2 - y1) * t; z1 = NEAR; }
    else if (z2 < NEAR) { const t = (NEAR - z2) / (z1 - z2); x2 += (x1 - x2) * t; y2 += (y1 - y2) * t; z2 = NEAR; }
    ctx.moveTo(W / 2 + x1 * F / z1, H / 2 - y1 * F / z1);
    ctx.lineTo(W / 2 + x2 * F / z2, H / 2 - y2 * F / z2);
    drawn++;
  }
  ctx.stroke();
  ctx.getImageData(0, 0, 1, 1); // force the draw to complete before we stop the clock
  return drawn;
}

function bench(n, glow, frames) {
  const seg = makeSegments(n);
  for (let i = 0; i < 20; i++) frame(seg, n, i * 0.01, glow); // warm-up
  const times = [];
  let drawn = 0;
  for (let i = 0; i < frames; i++) {
    const t0 = performance.now();
    drawn = frame(seg, n, i * 0.01, glow);
    times.push(performance.now() - t0);
  }
  times.sort((a, b) => a - b);
  const mean = times.reduce((a, b) => a + b, 0) / frames;
  return { segments: n, glow, drawnLastFrame: drawn, meanMs: +mean.toFixed(3), p95Ms: +times[Math.floor(frames * 0.95)].toFixed(3), maxMs: +times[frames - 1].toFixed(3) };
}

const results = [];
for (const n of [500, 2000, 10000]) for (const glow of [false, true]) results.push(bench(n, glow, 200));
document.getElementById('out').textContent = 'RESULT ' + JSON.stringify({ ua: navigator.userAgent, canvas: W + 'x' + H, results });
</script>
